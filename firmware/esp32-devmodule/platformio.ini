; ESP32 DevKit bench board — mirrors the LilyGo UI/link firmware
; without the A7670 modem. Wire an ILI9341 + XPT2046 shield to a
; classic ESP32 DevKit-V1 (WROOM-32) using the pin map in build_flags.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

; The default esp32dev partition table (1.4MB app) is too small once we pull
; in LVGL 9 + TFT_eSPI + WiFi + WiFiManager + ArduinoJson. When the linked
; image overflows the app slot, upload still "succeeds" but the ROM
; bootloader rejects the image at boot -> silent bootloop, blank Serial,
; blank TFT (exactly the symptom the smoke test does NOT show, because it
; is tiny). huge_app.csv gives us a single 3MB app slot.
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

; Some USB-serial bridges (CH340, CP210x) assert DTR/RTS when the monitor
; opens the port, which yanks EN/IO0 and either resets the ESP32 or holds
; it in the ROM bootloader — so the app never runs and the monitor stays
; blank. Disabling both lines lets the chip run normally when we attach.
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder, time, default

build_flags =
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -I src

lib_deps =
  lvgl/lvgl@^9.2.0
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17

; Board-only diagnostic. Upload this first if the normal firmware gives a
; blank serial monitor/TFT. It avoids TFT_eSPI, LVGL and WiFiManager entirely;
; if this does not print after pressing EN, the issue is wiring, USB/serial,
; power, boot strapping or the selected serial port — not application size.
[env:esp32dev-smoke]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = time, default
build_src_filter = +<smoke_main.cpp>
build_flags =
  -DMIND_BUDDY_SMOKE_TEST